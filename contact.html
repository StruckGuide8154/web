<!doctype html>
<html lang="en" data-accent="brass" data-pairing="serif-mono">
<head>
<meta charset="utf-8" />
<title>Contact — Man vs Man Barbers</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
<link rel="stylesheet" href="page-shell.css?v=8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>
<style>
  .map-placeholder { display: none; }
  #site-map { width: 100%; height: 100%; min-height: 420px; background: #0d0a06; }
  .leaflet-container { background: #0d0a06 !important; font-family: inherit; }
  .mvm-popup .leaflet-popup-content-wrapper {
    background: rgba(13,10,6,0.96);
    border: 0.5px solid rgba(201,168,76,0.35);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    color: #f0ece4;
    padding: 0;
  }
  .mvm-popup .leaflet-popup-content { margin: 16px 20px; }
  .mvm-popup .leaflet-popup-tip { background: rgba(13,10,6,0.96); }
  .mvm-popup .leaflet-popup-close-button { color: rgba(201,168,76,0.6) !important; top: 8px !important; right: 10px !important; }
  .mvm-popup .leaflet-popup-close-button:hover { color: #c9a84c !important; }
  .pop-name { font-family: 'Instrument Serif', serif; font-size: 15px; color: #c9a84c; margin-bottom: 4px; }
  .pop-addr { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(240,236,228,0.65); line-height: 1.6; letter-spacing: 0.04em; }
  .pop-book { display: inline-block; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #c9a84c; text-decoration: none; border-bottom: 1px solid rgba(201,168,76,0.4); padding-bottom: 1px; }
  .pop-book:hover { color: #e0c068; border-bottom-color: #e0c068; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function Hero() {
  return (
    <section className="hero hero-overlay" style={{backgroundImage: `linear-gradient(180deg, rgba(13,10,6,0.55) 0%, rgba(13,10,6,0.7) 60%, rgba(13,10,6,0.95) 100%), url(https://images.unsplash.com/photo-1517832606299-7ae9b720a186?auto=format&fit=crop&w=1800&q=80)`, minHeight: 380}}>
      <div className="hero-text-col">
        <div className="hero-eyebrow"><span>X</span><span style={{color:"var(--ink-soft)"}}>·</span><span>The Visit</span></div>
        <h1 className="hero-title">Find the <em>door.</em></h1>
        <p className="hero-sub">Suite 101, Phenix Salon — 7 Flying Horse Walk, NG1 2HN. Look for the Phenix building and follow signs to the first floor.</p>
      </div>
    </section>
  );
}

function Body() {
  const mapInitRef = React.useRef(false);
  React.useEffect(() => {
    if (mapInitRef.current || !window.L) return;
    var el = document.getElementById('site-map');
    if (!el || el._leaflet_id) return;
    mapInitRef.current = true;
    var LAT = 52.9527, LNG = -1.1491;
    var map = L.map('site-map', { center: [LAT, LNG], zoom: 16, scrollWheelZoom: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" style="color:#c9a84c">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" style="color:#c9a84c">CARTO</a>',
      subdomains: 'abcd', maxZoom: 20,
    }).addTo(map);
    var pinSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44"><path d="M16 2C9.37 2 4 7.37 4 14c0 9.25 12 28 12 28S28 23.25 28 14C28 7.37 22.63 2 16 2z" fill="#c9a84c" stroke="#0d0a06" stroke-width="1.5"/><circle cx="16" cy="14" r="5" fill="#0d0a06"/></svg>';
    var icon = L.divIcon({ html: pinSvg, className: '', iconSize: [32, 44], iconAnchor: [16, 44], popupAnchor: [0, -46] });
    L.marker([LAT, LNG], { icon })
      .addTo(map)
      .bindPopup('<div class="pop-name">Man vs Man Barbers</div><div class="pop-addr">Suite 101, Phenix Salon<br>7 Flying Horse Walk<br>Nottingham NG1 2HN</div><a class="pop-book" href="https://manvsmanbarbers.booksy.com/a/" target="_blank" rel="noopener">Book on Booksy →</a>', { className: 'mvm-popup', maxWidth: 220 })
      .openPopup();
    setTimeout(() => {
      var attr = document.querySelector('.leaflet-control-attribution');
      if (attr) attr.style.cssText = 'background:rgba(13,10,6,0.7);color:rgba(240,236,228,0.4);font-size:9px;';
    }, 500);
  }, []);

  return (
    <section style={{ borderBottom: "1px solid var(--ink)" }}>
      <div className="contact-grid">
        <div className="contact-side">
          <h2 style={{ fontFamily: "var(--serif)", fontWeight: 400, fontSize: 40, margin: "0 0 32px" }}>By post, by mail, <em style={{ color: "var(--accent)", fontStyle: "italic" }}>by phone.</em></h2>
          <dl>
            <div><dt>Address</dt><dd>Suite 101, Phenix Salon<br/>7 Flying Horse Walk<br/>Nottingham NG1 2HN</dd></div>
            <div><dt>Hours</dt><dd>Tue–Fri · 09:00–19:00<br/>Sat · 09:00–17:00<br/>Closed Sun &amp; Mon</dd></div>
            <div><dt>Email</dt><dd>hello@manvsmanbarbers.com</dd></div>
            <div><dt>Booking</dt><dd><a href="https://manvsmanbarbers.booksy.com/a/" target="_blank" rel="noopener" style={{color:"var(--accent)"}}>Booksy — book online →</a></dd></div>
          </dl>
          <div style={{ marginTop: 40, padding: "24px 0", borderTop: "1px solid var(--ink)", borderBottom: "1px solid var(--ink)" }}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--accent)", marginBottom: 12 }}>Getting here</div>
            <p style={{ fontFamily: "var(--mono)", fontSize: 12, lineHeight: 1.7, color: "var(--ink-soft)", margin: 0 }}>
              <strong style={{ color: "var(--ink)" }}>Train</strong> · 8 min walk from Nottingham station.<br/>
              <strong style={{ color: "var(--ink)" }}>Tram</strong> · Old Market Square stop, 3 min walk.<br/>
              <strong style={{ color: "var(--ink)" }}>Parking</strong> · Broadmarsh NCP or Lace Market nearby.
            </p>
          </div>
        </div>
        <div className="contact-side" style={{ padding: 0, position: "relative" }}>
          <div id="site-map"></div>
        </div>
      </div>
    </section>
  );
}

function Form() {
  const [sent, setSent] = React.useState(false);
  return (
    <section className="section-pad" style={{ background: "var(--bg-alt)" }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.2fr", gap: 64 }}>
        <div>
          <div className="section-tag"><span className="num">XI /</span> The Letter</div>
          <h2 className="display" style={{ fontSize: "clamp(32px, 4vw, 56px)" }}>Write <em>directly.</em></h2>
          <p style={{ fontFamily: "var(--mono)", fontSize: 12, lineHeight: 1.75, color: "var(--ink-soft)", maxWidth: "40ch", marginTop: 24 }}>
            For wedding mornings, suite hire, press enquiries, or anything that doesn't fit the booking form. I read every message — usually within a day.
          </p>
        </div>
        {sent ? (
          <div style={{ alignSelf: "center" }}>
            <div className="signature" style={{ fontSize: 56 }}>Thank you.</div>
            <p style={{ fontFamily: "var(--mono)", fontSize: 13, color: "var(--ink-soft)", marginTop: 16 }}>I'll write back within a day.</p>
          </div>
        ) : (
          <form className="cform" onSubmit={e => { e.preventDefault(); setSent(true); }} style={{ maxWidth: "none" }}>
            <div>
              <label htmlFor="n">Name</label>
              <input id="n" required />
            </div>
            <div>
              <label htmlFor="e">Email</label>
              <input id="e" type="email" required />
            </div>
            <div>
              <label htmlFor="r">Regarding</label>
              <select id="r" defaultValue="">
                <option value="" disabled>—</option>
                <option>A booking enquiry</option>
                <option>Wedding morning hire</option>
                <option>Press / interview</option>
                <option>Wholesale (apothecary)</option>
                <option>Something else</option>
              </select>
            </div>
            <div>
              <label htmlFor="m">Message</label>
              <textarea id="m" rows="3" required />
            </div>
            <button type="submit">Send the letter →</button>
          </form>
        )}
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <div className="nav-stack"><TopBar active="contact.html" /><Marquee /></div>
      <Hero />
      <Body />
      <Form />
      <Footer />
      <MvmTweaks />
      <window.TweaksTrigger />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
