<!doctype html>
<html lang="en" data-accent="brass" data-pairing="serif-mono">
<head>
<meta charset="utf-8" />
<title>Services — Man vs Man Barbers</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
<link rel="stylesheet" href="page-shell.css?v=6">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const HERO_IMG = "https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=1800&q=80";

const HAIRCUTS = [
  { name: "Haircut & Beard", price: "£45" },
  { name: "Skin Fade", price: "£30" },
  { name: "Haircut, Wash & Style", price: "£35" },
  { name: "Haircut (Re-style)", price: "£35" },
  { name: "Above Half-Guard", price: "£28" },
  { name: "Buzz Cut", price: "£20" },
];
const SHAVE = [
  { name: "Head Shave & Beard Trim", price: "£40" },
  { name: "Beard Shave", price: "£30" },
  { name: "Head Shave (Cut-Throat)", price: "£25" },
  { name: "Beard Grooming", price: "£20" },
  { name: "Beard Trim", price: "£15" },
];
const STUDENT_KIDS = [
  { name: "Student Haircut", price: "£25" },
  { name: "Student Skin Fade", price: "£28" },
  { name: "Student Hair & Beard", price: "£35" },
  { name: "Kid's Haircut (under 12)", price: "£20" },
  { name: "Kid's Haircut (12+)", price: "£25" },
];

function ScissorsMark() {
  return (
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="1.6">
      <circle cx="16" cy="44" r="7"/>
      <circle cx="16" cy="20" r="7"/>
      <line x1="22" y1="40" x2="56" y2="12"/>
      <line x1="22" y1="24" x2="56" y2="52"/>
      <text x="32" y="36" textAnchor="middle" fontFamily="serif" fontSize="6" letterSpacing="2" fill="currentColor" stroke="none">BARBER</text>
    </svg>
  );
}

function Hero() {
  return (
    <section className="hero hero-overlay" style={{backgroundImage: `linear-gradient(180deg, rgba(13,10,6,0.55) 0%, rgba(13,10,6,0.7) 60%, rgba(13,10,6,0.95) 100%), url(${HERO_IMG})`, minHeight: 380}}>
      <div className="hero-text-col">
        <div className="hero-eyebrow"><span>Services</span><span style={{color:"var(--ink-soft)"}}>·</span><span>Price List</span></div>
        <h1 className="hero-title">Barber <em>Shop</em><br/>Price List</h1>
        <p className="hero-sub">A small list, booked one at a time. The price reflects the time, the privacy, and that you'll never wait.</p>
      </div>
    </section>
  );
}

function PriceColumn({ title, rows }) {
  return (
    <div className="price-col">
      <div className="price-col-title">— {title} —</div>
      <ul className="price-list">
        {rows.map((r, i) => (
          <li key={i}>
            <span className="pl-name">{r.name}</span>
            <span className="pl-leader"></span>
            <span className="pl-price">{r.price}</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

function PricePoster() {
  return (
    <section className="price-poster-section">
      <div className="price-poster">
        <div className="price-poster-mark"><ScissorsMark /></div>
        <h2 className="price-poster-title">BARBER SHOP</h2>
        <div className="price-poster-sub">— Price List —</div>
        <div className="price-poster-grid">
          <PriceColumn title="Haircuts" rows={HAIRCUTS} />
          <PriceColumn title="Shave & Beard" rows={SHAVE} />
          <PriceColumn title="Students & Kids" rows={STUDENT_KIDS} />
        </div>
        <div className="price-poster-foot">
          <span>Tue–Fri · 09:00–19:00 · Sat · 09:00–17:00</span>
          <span className="dot">●</span>
          <span>By appointment only</span>
          <span className="dot">●</span>
          <span>7 Flying Horse Walk, Nottingham NG1 2HN</span>
        </div>
        <a href="https://manvsmanbarbers.booksy.com/a/" target="_blank" rel="noopener" className="btn-gold price-poster-cta"><window.CalIcon /> Book Appointment</a>
      </div>
    </section>
  );
}

function Notes() {
  return (
    <section className="section-pad" style={{ background: "var(--bg-alt)" }}>
      <div className="section-tag"><span className="num">VI /</span> The Fine Print</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 48 }}>
        {[
          { h: "Deposits", b: "Bookings via Booksy require a small deposit, redeemed against the price on the day. Held seven days." },
          { h: "Children", b: "Boys aged 6+ welcome with a parent. No drop-offs — the room is too small for waiting." },
          { h: "Latecomers", b: "More than ten minutes late and the sitting becomes a thirty-minute cut at the same price. The next client is already on their way." },
        ].map((x, i) => (
          <div key={i}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--accent)", marginBottom: 16, paddingBottom: 16, borderBottom: "1px solid var(--rule)" }}>Note 0{i+1}</div>
            <h3 style={{ fontFamily: "var(--serif)", fontWeight: 400, fontSize: 30, lineHeight: 1.1, margin: "0 0 16px", color: "var(--ink)" }}>{x.h}</h3>
            <p style={{ fontFamily: "var(--mono)", fontSize: 12, lineHeight: 1.7, color: "var(--ink-soft)", margin: 0, maxWidth: "32ch" }}>{x.b}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <div className="nav-stack"><TopBar active="services.html" /><Marquee /></div>
      <Hero />
      <PricePoster />
      <Notes />
      <Footer />
      <MvmTweaks />
      <window.TweaksTrigger />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
