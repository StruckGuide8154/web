<!doctype html>
<html lang="en" data-accent="brass" data-pairing="serif-mono">
<head>
<meta charset="utf-8" />
<title>Man vs Man Barbers — Private Suite, Nottingham</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Man vs Man Barbers — a private barber suite in Nottingham's Lace Market. By appointment only via Booksy." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
<link rel="stylesheet" href="page-shell.css?v=6">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

// Inline-safe SVG icons (line-style, gold)
function IcoScissors() {
  return (
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" strokeWidth="1.3">
      <circle cx="8" cy="22" r="4"/>
      <circle cx="8" cy="10" r="4"/>
      <line x1="11" y1="20" x2="28" y2="6"/>
      <line x1="11" y1="12" x2="28" y2="26"/>
    </svg>
  );
}
function IcoBeard() {
  return (
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" strokeWidth="1.3">
      <path d="M8 8 Q8 22 16 28 Q24 22 24 8"/>
      <path d="M11 14 Q16 18 21 14"/>
      <circle cx="13" cy="11" r="0.8" fill="currentColor"/>
      <circle cx="19" cy="11" r="0.8" fill="currentColor"/>
    </svg>
  );
}
function IcoRazor() {
  return (
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" strokeWidth="1.3">
      <path d="M5 8 H22 V14 H5 Z"/>
      <path d="M22 11 H27"/>
      <path d="M5 18 Q9 22 16 22 Q23 22 27 18"/>
      <path d="M9 5 Q9 7 11 7 M14 4 Q14 6 16 6 M19 5 Q19 7 21 7"/>
    </svg>
  );
}
function IcoDryer() {
  return (
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" strokeWidth="1.3">
      <path d="M5 11 L20 7 V21 L5 17 Z"/>
      <path d="M20 11 H26 V17 H20"/>
      <line x1="13" y1="21" x2="13" y2="27"/>
      <rect x="11" y="27" width="4" height="2"/>
    </svg>
  );
}
function IcoStar() {
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2">
      <circle cx="12" cy="10" r="4"/>
      <path d="M5 21 Q5 14 12 14 Q19 14 19 21"/>
    </svg>
  );
}
function IcoChair() {
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2">
      <path d="M6 4 H18 V14 H6 Z"/>
      <path d="M4 14 H20 V18 H4 Z"/>
      <line x1="7" y1="18" x2="7" y2="22"/>
      <line x1="17" y1="18" x2="17" y2="22"/>
    </svg>
  );
}
function IcoTarget() {
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2">
      <circle cx="12" cy="12" r="8"/>
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2" x2="12" y2="6"/>
      <line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="6" y2="12"/>
      <line x1="18" y1="12" x2="22" y2="12"/>
    </svg>
  );
}
function IcoPhone() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4">
      <path d="M5 4 L9 4 L11 9 L8.5 11 Q11 15 13 17.5 L15 15 L20 17 V20 Q14 22 8 17 Q3 12 5 6 Z"/>
    </svg>
  );
}
function IcoPin() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4">
      <path d="M12 21 Q5 14 5 9 A7 7 0 0 1 19 9 Q19 14 12 21 Z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </svg>
  );
}
function IcoClock() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4">
      <circle cx="12" cy="12" r="9"/>
      <polyline points="12,7 12,12 16,14"/>
    </svg>
  );
}

const STOCK = {
  hero: "https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1400&q=80",
  client1: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80",
  client2: "https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?auto=format&fit=crop&w=200&q=80",
  client3: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=200&q=80",
};

function Hero() {
  return (
    <section className="hero hero-overlay" style={{backgroundImage: `linear-gradient(180deg, rgba(13,10,6,0.55) 0%, rgba(13,10,6,0.7) 60%, rgba(13,10,6,0.95) 100%), url(${STOCK.hero})`}}>
      <div className="hero-text-col">
        <div className="hero-eyebrow"><span>Classic Style</span><span style={{color:"var(--ink-soft)"}}>·</span><span>Modern Precision</span></div>
        <h1 className="hero-title">
          Premium <em>Barber</em><br/>Experience
        </h1>
        <p className="hero-sub">
          Sharp cuts. Expert beard work. Hot-towel shaves. Elevate your look — elevate your confidence.
        </p>
        <div className="hero-cta">
          <a href="services.html" className="btn-gold"><window.CalIcon /> Book Appointment</a>
          <a href="services.html" className="btn-ghost">View Services <span className="arrow">›</span></a>
        </div>
      </div>
    </section>
  );
}

function Services() {
  const cards = [
    { ico: <IcoScissors/>, name: "Haircut", desc: "Precision cuts tailored to your style." },
    { ico: <IcoBeard/>, name: "Beard Trim", desc: "Expert beard shaping and detailing." },
    { ico: <IcoRazor/>, name: "Hot Towel Shave", desc: "Classic straight razor shave with hot towel treatment." },
    { ico: <IcoDryer/>, name: "Styling", desc: "Professional styling for the perfect finish." },
  ];
  return (
    <section className="section-pad" style={{background: "var(--bg)", paddingTop: 28, paddingBottom: 28}}>
      <div className="services-row">
        {cards.map((c, i) => (
          <div className="svc-card" key={i}>
            <div className="glyph">{c.ico}</div>
            <h3>{c.name}</h3>
            <div className="underline"></div>
            <p>{c.desc}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

function Pillars() {
  return (
    <div className="pillars">
      <div className="pillar">
        <div className="glyph"><IcoStar/></div>
        <div>
          <h4>Expert Hands</h4>
          <p>One private suite, years on the chair. Mo started cutting at 17 and hasn't stopped perfecting since.</p>
        </div>
      </div>
      <div className="pillar">
        <div className="glyph"><IcoChair/></div>
        <div>
          <h4>Private Atmosphere</h4>
          <p>One client at a time. Brass fittings, a record turning, a drink poured if you'd like.</p>
        </div>
      </div>
      <div className="pillar">
        <div className="glyph"><IcoTarget/></div>
        <div>
          <h4>Precision Grooming</h4>
          <p>Detail-led. Lines walked back twice. We don't finish until the mirror agrees.</p>
        </div>
      </div>
    </div>
  );
}

function Testimonials() {
  const quotes = [
    { p: "Best barber shop I've ever been to. The attention to detail and atmosphere are unmatched.", who: "James R." },
    { p: "Consistent perfection every time. My beard has never looked better. Highly recommend!", who: "Michael T." },
    { p: "Top-notch service, great vibes, and the best haircut I've had in years.", who: "David K." },
  ];
  return (
    <section className="testimonials">
      <div className="flourish"><span>What Our Clients Say</span></div>
      <div className="testimonial-grid">
        <div className="tnav">‹</div>
        {quotes.map((q, i) => (
          <div className="tcard" key={i}>
            <div className="avatar" style={{backgroundImage: `url(${[STOCK.client1, STOCK.client2, STOCK.client3][i]})`, backgroundSize: "cover", backgroundPosition: "center"}}></div>
            <div>
              <div className="stars">★ ★ ★ ★ ★</div>
              <p>"{q.p}"</p>
              <cite>— {q.who}</cite>
            </div>
          </div>
        ))}
        <div className="tnav">›</div>
      </div>
    </section>
  );
}

function CtaBar() {
  return (
    <div className="cta-bar">
      <div>
        <div className="ico"><window.CalIcon/></div>
        <div>
          <div className="ttl">Ready For Your Cut?</div>
          <div className="body">Book your seat today and feel the <strong>Man vs Man</strong> difference.</div>
        </div>
      </div>
      <div className="cta-btn-cell">
        <a className="btn-gold" href="https://manvsmanbarbers.booksy.com/a/" target="_blank" rel="noopener"><window.CalIcon/> Book Appointment</a>
      </div>
      <div>
        <div className="ico"><IcoPin/></div>
        <div>
          <div className="ttl">Address</div>
          <div className="body">Suite 101, Phenix Salon<br/>7 Flying Horse Walk, NG1 2HN</div>
        </div>
      </div>
      <div>
        <div className="ico"><IcoClock/></div>
        <div>
          <div className="ttl">Hours</div>
          <div className="body">Tue–Fri · 09:00–19:00<br/>Sat · 09:00–17:00 · Sun &amp; Mon closed</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <>
      <div className="nav-stack">
        <TopBar active="index.html" />
        <window.Marquee />
      </div>
      <Hero />
      <Services />
      <Pillars />
      <Testimonials />
      <CtaBar />
      <Footer />
      <MvmTweaks />
      <window.TweaksTrigger />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
