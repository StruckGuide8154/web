<!doctype html>
<html lang="en" data-accent="brass" data-pairing="serif-mono">
<head>
<meta charset="utf-8" />
<title>Gallery — Man vs Man Barbers</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
<link rel="stylesheet" href="page-shell.css?v=8">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// Asymmetric, magazine-style grid — no uniform card grid
const ITEMS = [
  { area: "1 / 1 / 5 / 6",  cat: "cuts",       img: "https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=1200&q=80" },
  { area: "1 / 6 / 3 / 10", cat: "suite",      img: "https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=900&q=80" },
  { area: "1 / 10 / 4 / 13",cat: "cuts",       img: "https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=900&q=80" },
  { area: "5 / 1 / 8 / 5",  cat: "apothecary", img: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=900&q=80" },
  { area: "3 / 6 / 6 / 10", cat: "cuts",       img: "https://images.unsplash.com/photo-1635273051937-c0e0e6c6f5b6?auto=format&fit=crop&w=900&q=80" },
  { area: "4 / 10 / 7 / 13",cat: "beards",     img: "https://images.unsplash.com/photo-1593702288056-f173cb7c0bf5?auto=format&fit=crop&w=900&q=80" },
  { area: "8 / 1 / 11 / 5", cat: "suite",      img: "https://images.unsplash.com/photo-1622288432450-277d0fef5ed6?auto=format&fit=crop&w=700&q=80" },
  { area: "6 / 5 / 11 / 9", cat: "cuts",       img: "https://images.unsplash.com/photo-1605497788044-5a32c7078486?auto=format&fit=crop&w=1100&q=80" },
  { area: "7 / 9 / 11 / 13",cat: "suite",      img: "https://images.unsplash.com/photo-1517832606299-7ae9b720a186?auto=format&fit=crop&w=900&q=80" },
  { area: "11 / 1 / 14 / 7",cat: "apothecary", img: "https://images.unsplash.com/photo-1626379801357-537572add48e?auto=format&fit=crop&w=1100&q=80" },
  { area: "11 / 7 / 14 / 13",cat: "beards",    img: "https://images.unsplash.com/photo-1622287162716-f311baa1a2b8?auto=format&fit=crop&w=1100&q=80" },
];

function Hero() {
  return (
    <section className="hero hero-overlay" style={{backgroundImage: `linear-gradient(180deg, rgba(13,10,6,0.55) 0%, rgba(13,10,6,0.7) 60%, rgba(13,10,6,0.95) 100%), url(https://images.unsplash.com/photo-1605497788044-5a32c7078486?auto=format&fit=crop&w=1800&q=80)`, minHeight: 380}}>
      <div className="hero-text-col">
        <div className="hero-eyebrow"><span>IX</span><span style={{color:"var(--ink-soft)"}}>·</span><span>The Gallery</span></div>
        <h1 className="hero-title">Work, <em>shot honestly.</em></h1>
        <p className="hero-sub">Real clients, real cuts, real Tuesday afternoons. Photographed with permission and a 35mm lens.</p>
      </div>
    </section>
  );
}

function Filter({ active, setActive }) {
  const tabs = ["All", "Cuts", "Beards", "Suite", "Apothecary"];
  return (
    <div style={{ display: "flex", gap: 0, borderBottom: "1px solid var(--rule)", padding: "0 28px", background: "var(--bg)" }}>
      {tabs.map(t => (
        <button key={t} onClick={() => setActive(t.toLowerCase())} style={{
          padding: "20px 24px",
          background: "transparent",
          border: "none",
          borderRight: "1px solid var(--rule)",
          borderBottom: active === t.toLowerCase() ? "2px solid var(--accent)" : "2px solid transparent",
          marginBottom: -1,
          fontFamily: "var(--mono)",
          fontSize: 11,
          letterSpacing: "0.18em",
          textTransform: "uppercase",
          cursor: "pointer",
          color: active === t.toLowerCase() ? "var(--accent)" : "var(--ink)"
        }}>{t}</button>
      ))}
    </div>
  );
}

function Grid({ active }) {
  const visible = active === "all" ? ITEMS : ITEMS.filter(it => it.cat === active);
  return (
    <section className="section-pad">
      {active === "all" ? (
        <div className="gallery-mosaic" style={{
          display: "grid",
          gridTemplateColumns: "repeat(12, 1fr)",
          gridAutoRows: "60px",
          gap: 12
        }}>
          {ITEMS.map((it, i) => (
            <div key={i} className="gimg" style={{ gridArea: it.area, backgroundImage: `url(${it.img})` }}></div>
          ))}
        </div>
      ) : (
        <div className="gallery-mosaic" style={{
          display: "grid",
          gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
          gap: 12
        }}>
          {visible.map((it, i) => (
            <div key={i} className="gimg" style={{ aspectRatio: "4/3", backgroundImage: `url(${it.img})` }}></div>
          ))}
        </div>
      )}
    </section>
  );
}

function App() {
  const [active, setActive] = React.useState("all");
  return (
    <>
      <div className="nav-stack"><TopBar active="gallery.html" /><Marquee /></div>
      <Hero />
      <Filter active={active} setActive={setActive} />
      <Grid active={active} />
      <Footer />
      <MvmTweaks />
      <window.TweaksTrigger />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
